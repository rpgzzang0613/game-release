<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>게임 발매 일정 관리자</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header class="topbar">
		<div class="topbar__inner">
			<div>
				<p class="eyebrow">GAME RELEASE ADMIN</p>
				<h1>게임 발매 일정 관리</h1>
			</div>
			<div class="account-actions">
				<span class="access-status"><span aria-hidden="true"></span> 관리자</span>
				<a class="logout-button" href="/cdn-cgi/access/logout">로그아웃</a>
			</div>
		</div>
	</header>

	<main class="admin-page">
		<section class="create-section" aria-labelledby="create-title">
			<div class="section-heading">
				<div>
					<h2 id="create-title">새 게임 등록</h2>
					<p>게임명, 발매일, 플랫폼을 입력하세요.</p>
				</div>
			</div>

			<form id="createForm" class="release-form">
				<div class="form-field form-field--title">
					<label for="gameTitle">게임명</label>
					<input id="gameTitle" name="title" type="text" placeholder="게임명을 입력하세요" autocomplete="off" required>
				</div>

				<div class="form-field form-field--date">
					<label for="releaseDate">발매일</label>
					<input id="releaseDate" name="release_date" type="date" required>
				</div>

				<fieldset class="platform-field">
					<legend>플랫폼</legend>
					<div class="platform-options">
						<label><input type="checkbox" name="platform" value="NS"><span>NS</span></label>
						<label><input type="checkbox" name="platform" value="NS2"><span>NS2</span></label>
						<label><input type="checkbox" name="platform" value="PS4"><span>PS4</span></label>
						<label><input type="checkbox" name="platform" value="PS5"><span>PS5</span></label>
						<label><input type="checkbox" name="platform" value="XBOX"><span>XBOX</span></label>
						<label><input type="checkbox" name="platform" value="Steam"><span>Steam</span></label>
					</div>
				</fieldset>

				<button class="button button--primary create-button" type="submit">게임 등록</button>
			</form>
			<p id="createStatus" class="form-status" role="status" hidden></p>
		</section>

		<section class="list-section" aria-labelledby="list-title">
			<div class="section-heading list-heading">
				<div>
					<h2 id="list-title">등록된 게임</h2>
					<p>발매일이 빠른 순서로 표시됩니다.</p>
				</div>
			</div>

			<form id="searchForm" class="list-toolbar" role="search">
				<div class="search-field">
					<label class="sr-only" for="titleSearch">게임명 검색</label>
					<input id="titleSearch" name="q" type="search" placeholder="게임명으로 검색" autocomplete="off">
					<button class="button button--secondary search-button" type="submit">검색</button>
				</div>
				<label class="release-filter">
					<input id="hideReleased" type="checkbox" checked>
					<span>이미 발매된 게임 제외</span>
				</label>
			</form>
			<p id="listStatus" class="list-status" role="status" hidden></p>

			<div class="release-list">
				<div class="release-list__header" aria-hidden="true">
					<span>발매일</span>
					<span>게임명</span>
					<span>플랫폼</span>
					<span>관리</span>
				</div>
				<div id="releaseRows" aria-live="polite"></div>
			</div>
			<div class="load-more-wrap" hidden>
				<button class="button button--secondary load-more-button" type="button">더 보기</button>
			</div>
		</section>
	</main>

	<template id="releaseTemplate">
		<article class="release-item">
			<div class="release-item__date">
				<span class="mobile-label">발매일</span>
				<time></time>
			</div>
			<div class="release-item__title">
				<span class="mobile-label">게임명</span>
				<strong></strong>
			</div>
			<div class="release-item__platforms">
				<span class="mobile-label">플랫폼</span>
				<div class="platform-badges"></div>
			</div>
			<div class="release-item__actions">
				<button class="button button--secondary edit-button" type="button">수정</button>
				<button class="button button--danger delete-button" type="button">삭제</button>
			</div>
		</article>
	</template>

	<template id="editTemplate">
		<form class="edit-form">
			<div class="form-field edit-form__title">
				<label>게임명</label>
				<input name="title" type="text" autocomplete="off" required>
			</div>
			<div class="form-field edit-form__date">
				<label>발매일</label>
				<input name="release_date" type="date" required>
			</div>
			<fieldset class="platform-field edit-form__platforms">
				<legend>플랫폼</legend>
				<div class="platform-options">
					<label><input type="checkbox" name="platform" value="NS"><span>NS</span></label>
					<label><input type="checkbox" name="platform" value="NS2"><span>NS2</span></label>
					<label><input type="checkbox" name="platform" value="PS4"><span>PS4</span></label>
					<label><input type="checkbox" name="platform" value="PS5"><span>PS5</span></label>
					<label><input type="checkbox" name="platform" value="XBOX"><span>XBOX</span></label>
					<label><input type="checkbox" name="platform" value="Steam"><span>Steam</span></label>
				</div>
			</fieldset>
			<div class="edit-form__actions">
				<button class="button button--primary save-button" type="submit">저장</button>
				<button class="button button--secondary cancel-button" type="button">취소</button>
			</div>
			<p class="edit-form__status" role="status" hidden></p>
		</form>
	</template>

	<script src="/app.js"></script>
</body>
</html>
